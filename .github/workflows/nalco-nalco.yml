name: Nalco PDF Downloader

on:
  workflow_dispatch: {}
  schedule:
    # 09:00, 12:00, 15:00, 18:00 IST = 03:30, 06:30, 09:30, 12:30 UTC
    - cron: "30 3,6,9,12 * * *"

permissions:
  contents: write

concurrency:
  group: nalco-pdf-downloader
  cancel-in-progress: false

env:
  # NALCO's legacy HTTPS certificate chain is rejected by GitHub-hosted runners.
  # The workflow patches only the NALCO requests to use the controlled fallback.
  BASE_DIR: .

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 lxml pdfplumber pandas openpyxl
          fi

      - name: Ensure output directories exist
        run: |
          mkdir -p pdfs
          mkdir -p data
          mkdir -p manual_pdfs

      - name: Prepare NALCO TLS fallback
        run: |
          # NALCO's certificate chain is not trusted by the hosted runner.
          # Patch only the two NALCO HTTP requests in this workspace before
          # running either the manual backfill processor or the live scraper.
          python - <<'PY'
          from pathlib import Path

          p = Path("nalco_scraper.py")
          s = p.read_text(encoding="utf-8")

          replacements = [
              (
                  'requests.get(url, headers={"User-Agent": UA}, timeout=60)',
                  'requests.get(url, headers={"User-Agent": UA}, timeout=60, verify=False)',
              ),
              (
                  'requests.get(url, headers=headers, timeout=60, stream=True, allow_redirects=True)',
                  'requests.get(url, headers=headers, timeout=60, stream=True, allow_redirects=True, verify=False)',
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          if changed:
              p.write_text(s, encoding="utf-8")
              print("Applied NALCO TLS fallback to page and PDF requests.")
          else:
              print("NALCO TLS fallback already present or source pattern changed; continuing.")
          PY

      - name: Backfill manual circular PDFs
        run: |
          python backfill_manual_pdfs.py

      - name: Run scraper
        env:
          BASE_DIR: ${{ env.BASE_DIR }}
        run: |
          echo "PWD before run: $(pwd)"
          python nalco_scraper.py
          echo "Scraper finished."

      - name: List outputs
        run: |
          echo "--- pdfs/"
          ls -la pdfs || true
          echo "--- manual_pdfs/"
          ls -la manual_pdfs || true
          echo "--- data/"
          ls -la data || true

      - name: Upload PDF artifacts (if any)
        if: ${{ hashFiles('pdfs/*.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nalco-pdfs
          path: pdfs/*.pdf
          if-no-files-found: ignore

      - name: Upload Excel artifact (if exists)
        if: ${{ hashFiles('data/nalco_prices.xlsx') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nalco-prices-xlsx
          path: data/nalco_prices.xlsx
          if-no-files-found: ignore

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update Nalco data ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

            # Rebase onto the latest main in case a repository update landed
            # while this job was running, then push the generated data.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Push succeeded on attempt ${attempt}."
                  exit 0
                fi
              fi
              git rebase --abort || true
              sleep 2
            done

            echo "Could not push after 3 attempts." >&2
            exit 1
          else
            echo "No changes to commit."
          fi
